[project]
name = "handi"
version = "0.1.0"
description = "Hand-authored LLM weights with zero gradient descent: authoring library, weight analysis, Rung 1 adder, Rung 2 experiment."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "transformers>=4.57",
    "safetensors>=0.5",
    "huggingface_hub>=0.30",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "tokenizers>=0.21",
    "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handi"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
